<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <meta name="description" content="四种模型、三个种子。比较排序和校准指标，再检验同一 GCN 对测试图删边的敏感性。">
  <title>Investor Network GNN · 图信号对照实验</title>
  <link rel="stylesheet" href="workbench.css">
  <script defer src="data.js"></script>
  <script defer src="workbench.js"></script>
</head>
<body>
  <a class="skip" href="#main">跳至工作台</a>
  <header class="rail">
    <div class="rail-inner">
      <a class="brand" href="#main">
        <span class="brand-mark" aria-hidden="true" id="brand-mark"></span>
        <span id="brand">数据工作台</span>
      </a>
      <nav aria-label="工作台导航">
        <a href="#overview"><span class="nav-icon overview-icon" aria-hidden="true"></span>分析概览</a>
        <a href="#records"><span class="nav-icon records-icon" aria-hidden="true"></span>明细记录</a>
        <a href="#sources"><span class="nav-icon sources-icon" aria-hidden="true"></span>数据来源</a>
      </nav>
      <div class="rail-bottom">
        <!-- Portfolio return link -->
        <a id="repository" href="https://github.com/dev-belly">GitHub 仓库</a>
      </div>
    </div>
  </header>

  <main id="main" tabindex="-1">
    <section class="hero" id="overview" aria-labelledby="title">
      <div class="hero-intro">
        <div class="hero-context">
          <p id="toolbar-label">数据工作台</p>
          <p id="hero-kicker"></p>
        </div>
        <h1 id="title">图信号对照实验</h1>
        <p class="hero-description" id="description"></p>
      </div>
      <div class="hero-stat" id="hero-stat" hidden>
        <span id="hero-stat-label"></span>
        <strong id="hero-stat-value"></strong>
        <small id="hero-stat-note"></small>
      </div>
    </section>

    <dl class="metrics" id="metrics" aria-label="样例概要" hidden></dl>
    <noscript><p class="notice">请启用 JavaScript 以运行工作台。</p></noscript>
    <p class="notice" id="startup-error" role="alert" hidden>样例未能加载。请确认工作台文件完整，再刷新页面。</p>

    <div class="workspace" id="workspace" hidden>
      <div class="workspace-main">
        <section class="panel chart-panel" aria-labelledby="chart-heading">
          <div class="panel-heading">
            <h2 id="chart-heading"></h2>
            <div class="views" id="views" role="group" aria-label="图表视图"></div>
          </div>
          <p class="panel-copy" id="chart-caption"></p>
          <div id="chart"></div>
        </section>

        <section class="panel records-panel" id="records" aria-labelledby="records-heading">
          <div class="panel-heading">
            <h2 id="records-heading"></h2>
            <div class="panel-actions">
              <button class="text-button" id="reset" type="button">重置筛选</button>
              <button class="button primary" id="export" type="button" disabled>导出筛选结果</button>
            </div>
          </div>
          <div id="filters" class="filters"></div>
          <div class="table-wrap records-table" id="records-table" tabindex="0" role="region" aria-label="筛选记录">
            <table role="table">
              <thead role="rowgroup"><tr id="columns" role="row"></tr></thead>
              <tbody id="rows" role="rowgroup"></tbody>
            </table>
          </div>
          <p id="empty" class="empty" hidden>没有匹配的记录。试试其他筛选条件。</p>
          <footer class="pagination">
            <span id="count" role="status" aria-live="polite"></span>
            <div class="page-buttons">
              <button class="button" id="previous" type="button">上一页</button>
              <button class="button" id="next" type="button">下一页</button>
            </div>
          </footer>
        </section>
      </div>

      <section class="panel detail" id="detail" aria-labelledby="detail-heading" tabindex="-1">
        <div class="panel-heading">
          <h2 id="detail-heading"></h2>
          <div class="panel-actions">
            <button class="button" id="pin-record" type="button" disabled>设为对照</button>
            <button class="text-button" id="download-record" type="button" disabled>导出 JSON</button>
          </div>
        </div>
        <button class="text-button return-records" id="return-records" type="button">返回选中记录</button>
        <section class="comparison" id="comparison" aria-labelledby="comparison-heading" hidden>
          <div class="comparison-top">
            <h3 id="comparison-heading">记录对照</h3>
            <button class="text-button" id="clear-comparison" type="button">取消对照</button>
          </div>
          <div id="comparison-content"></div>
          <div class="comparison-actions" id="comparison-actions" hidden>
            <button class="button primary" id="share-comparison" type="button">复制对照链接</button>
            <button class="button" id="export-comparison" type="button">导出对照 CSV</button>
          </div>
          <p class="share-status" id="share-status" role="status"></p>
        </section>
        <div id="record-detail"></div>
      </section>
    </div>

    <footer class="panel source-panel" id="sources" aria-labelledby="sources-heading" hidden>
      <h2 id="sources-heading">数据来源与口径</h2>
      <p id="source-note"></p>
      <ul id="source-list"></ul>
    </footer>
  </main>
  <dialog class="share-dialog" id="share-dialog" aria-labelledby="share-heading">
    <form method="dialog">
      <h2 id="share-heading">对照链接</h2>
      <p>选中下方地址，复制后可打开这组对照。</p>
      <label for="share-url">链接地址</label>
      <input id="share-url" type="url" readonly>
      <button class="button primary" type="submit">关闭</button>
    </form>
  </dialog>
</body>
</html>
